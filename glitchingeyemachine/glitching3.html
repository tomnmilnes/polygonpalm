<!DOCTYPE html>
<html>
<head>
    <title>PLY Viewer</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/PLYLoader.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        camera.position.set(3, 3, 5);  // Moved camera below and back
        camera.lookAt(0, 0, 0);

        const loader = new THREE.PLYLoader();
        loader.load(
            'Tender_table30k.ply',
            function (geometry) {
                const material = new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 0.001  // Adjusted size for points
                });
                const points = new THREE.Points(geometry, material);
                
                // Scale the entire model
                points.scale.set(10, 10, 10);  // Makes model 2x larger
                
                // Flip the model upside down (180 degrees around X axis)
                points.rotation.x = Math.PI;
                
                scene.add(points);
            },
            (xhr) => {
                console.log((xhr.loaded / xhr.total * 100) + '% loaded');
            },
            (error) => {
                console.log('An error happened:', error);
            }
        );

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
