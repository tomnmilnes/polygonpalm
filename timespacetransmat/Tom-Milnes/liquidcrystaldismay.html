<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Liquid Crystal Dismay</title>
    <style>
        body { 
            margin: 0; 
            background: #8B1E3F;
            overflow: hidden; 
        }
        canvas { 
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }
        .blur-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backdrop-filter: blur(20px); /* Adjust the blur intensity here */
            background: rgba(0, 0, 0, 0.2); /* Optional: Add a semi-transparent background */
            pointer-events: none; /* Ensure the overlay doesn't block interactions */
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true,
            alpha: true 
        });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Camera positioning
        camera.position.z = 3;
        camera.position.y = 0;

        // Create ambient light
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        // Create a sphere geometry for the orb
        const geometry = new THREE.SphereGeometry(1, 64, 64);
        
        // Custom shader material
        const material = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                color1: { value: new THREE.Color(0xA7C7E7) },
                color2: { value: new THREE.Color(0xFFB347) }
            },
            vertexShader: `
                varying vec2 vUv;
                varying vec3 vNormal;
                
                void main() {
                    vUv = uv;
                    vNormal = normal;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform vec3 color1;
                uniform vec3 color2;
                varying vec2 vUv;
                varying vec3 vNormal;

                void main() {
                    float noise = sin(vUv.x * 10.0 + time) * cos(vUv.y * 10.0 + time) * 0.5 + 0.5;
                    float pulse = sin(time * 0.5) * 0.5 + 0.5;
                    vec3 color = mix(color1, color2, noise * pulse);
                    
                    // Add soft glow
                    float fresnel = pow(1.0 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                    color += vec3(0.2, 0.4, 0.6) * fresnel;
                    
                    gl_FragColor = vec4(color, 1.0);
                }
            `
        });

        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // Background sphere setup
        const bgGeometry = new THREE.SphereGeometry(100, 64, 64);
        const bgMaterial = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                color1: { value: new THREE.Color('#A7C7E7') },
                color2: { value: new THREE.Color('#FFB347') },
                color3: { value: new THREE.Color('#DDA0DD') }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                uniform vec3 color1;
                uniform vec3 color2;
                uniform vec3 color3;
                varying vec2 vUv;

                void main() {
                    float t = time * 0.1;
                    vec2 pos = vUv * 2.0 - 1.0;
                    float angle = atan(pos.y, pos.x);
                    float radius = length(pos);
                    
                    float colorMix = sin(radius * 3.0 - t) * 0.5 + 0.5;
                    float colorMix2 = cos(angle * 2.0 + t * 0.5) * 0.5 + 0.5;
                    
                    vec3 color = mix(color1, color2, colorMix);
                    color = mix(color, color3, colorMix2);
                    
                    gl_FragColor = vec4(color, 1.0);
                }
            `,
            side: THREE.BackSide
        });

        const backgroundSphere = new THREE.Mesh(bgGeometry, bgMaterial);
        scene.add(backgroundSphere);

        function animate(time) {
            requestAnimationFrame(animate);
            
            // Update both shader time uniforms
            material.uniforms.time.value = time * 0.001;
            bgMaterial.uniforms.time.value = time * 0.001;
            
            // Gentle rotation
            sphere.rotation.x = Math.sin(time * 0.0001) * 0.5;
            sphere.rotation.y = Math.cos(time * 0.0002) * 0.5;
            
            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate(0);
    </script>
     <!-- Add the blur overlay -->
     <div class="blur-overlay"></div>
</body>
</html>
