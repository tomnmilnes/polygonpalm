<!DOCTYPE html>
<html>
<head>
    <title>Ambient Teleportation</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden;
            background: linear-gradient(135deg, #ea90e4, #e27be5, #c4a0f2);
        }
        canvas { 
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            filter: blur(1px);
        }
    </style>
    <!-- Load SimplexNoise before main script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Set up fullscreen canvas
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // Update color configurations
        const colors = {
            core: '#ffd700',    // Gold
            inner: '#ffb347',   // Pastel orange
            mid: '#ff7f50',     // Coral
            outer: '#ff6b6b'    // Soft red
        };

        class Particle {
            constructor() {
                this.reset();
                this.speed = 0.0005 + Math.random() * 0.0001;
                this.angle = Math.random() * Math.PI * 5;
                this.radius = Math.random() * (Math.min(canvas.width, canvas.height) * 0.5);
                this.orbitRadius = this.radius;
                this.colorIndex = Math.random();
            }

            reset() {
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.size = 2 + Math.random() * 3;
                this.alpha = 0.1 + Math.random() * 0.4;
            }

            update(time) {
                // Orbital motion
                this.angle += this.speed;
                this.radius = this.orbitRadius + Math.sin(time * 0.001 + this.angle) * 9;
                
                this.x = canvas.width/2 + Math.cos(this.angle) * this.radius;
                this.y = canvas.height/2 + Math.sin(this.angle) * this.radius;

                // Update color calculations
                const distanceRatio = this.radius / (Math.min(canvas.width, canvas.height) * 0.4);
                const hue = 45 + (distanceRatio * 15); // Gold to warm orange range
                const saturation = 90 - (distanceRatio * 20);
                const lightness = 65 - (distanceRatio * 15);
                this.alpha = 0.2 + Math.random() * 0.1; // Slightly increased opacity
            }

            draw() {
                // Create soft glow effect
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.size * 2
                );
                
                // Get base color
                const distanceRatio = this.radius / (Math.min(canvas.width, canvas.height) * 0.4);
                const hue = 45 + (distanceRatio * 15); // Gold to warm orange
                const saturation = 90 - (distanceRatio * 20);
                const lightness = 65 - (distanceRatio * 15);
                
                // Create soft edge effect
                gradient.addColorStop(0, `hsla(${hue}, ${saturation}%, ${lightness}%, ${this.alpha})`);
                gradient.addColorStop(0.5, `hsla(${hue}, ${saturation}%, ${lightness}%, ${this.alpha * 0.5})`);
                gradient.addColorStop(1, `hsla(${hue}, ${saturation}%, ${lightness}%, 0)`);

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
            }
        }

        const particles = [];
        
        function init() {
            particles.length = 0;
            for (let i = 0; i < 3000; i++) {
                particles.push(new Particle());
            }
        }

        function createRadialGradient() {
            const gradient = ctx.createRadialGradient(
                canvas.width/2, canvas.height/2, 0,
                canvas.width/2, canvas.height/2, Math.min(canvas.width, canvas.height) * 0.5
            );
            gradient.addColorStop(0, 'rgba(230, 99, 242, 0.9)');  // Light pastel purple
            gradient.addColorStop(0.3, 'rgba(213, 184, 242, 0.8)'); // Mid pastel purple
            gradient.addColorStop(0.6, 'rgba(196, 160, 242, 0.7)'); // Darker pastel purple
            gradient.addColorStop(1, 'rgba(196, 160, 242, 0.6)');   // Fade to transparent
            return gradient;
        }

        function animate(time) {
            // Adjust clear effect for softer trails
            ctx.fillStyle = 'rgba(230, 213, 242, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw base gradient
            ctx.fillStyle = createRadialGradient();
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update and draw particles
            particles.forEach(particle => {
                particle.update(time);
                particle.draw();
            });

            requestAnimationFrame(animate);
        }

        init();
        animate(0);
    </script>
</body>
</html>
