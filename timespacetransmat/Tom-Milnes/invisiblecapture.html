<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invisible Capture | PolygonPalm</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/loaders/PLYLoader.js"></script>
    <style>
        :root {
            --primary-color: #0a192f;
            --secondary-color: #64ffda;
            --accent-color: #ff416c;
            --text-color: #e6f1ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Mono', monospace;
        }

        body {
            background: var(--primary-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        .container {
            padding: 20px;
            min-height: 100vh;
        }

        #scene-container {
            width: 100%;
            height: 50vh;
            position: relative;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .glitch-text {
            font-size: 2rem;
            color: var(--secondary-color);
            text-transform: uppercase;
            position: relative;
            animation: glitch 1s infinite;
        }

        .content-section {
            margin: 2rem 0;
            padding: 1rem;
            border: 1px solid var(--secondary-color);
            background: rgba(100, 255, 218, 0.1);
        }

        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }

        @media (min-width: 769px) {
            body:before {
                content: "This experience is designed for mobile devices only.";
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: var(--primary-color);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 9999;
                padding: 2rem;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="glitch-text">Invisible Capture</h1>
        <div id="scene-container"></div>
        <div class="content-section">
            <p>An exploration of the liminal spaces between digital representation and physical reality. This work examines the failures and artifacts produced when attempting to capture transparent, reflective, and ephemeral objects in 3D space.</p>
        </div>
    </div>

    <script>
        let camera, scene, renderer;
        let pointCloud;
        let controls;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a192f);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 2;
            camera.position.y = 0.5;
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight * 0.5);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('scene-container').appendChild(renderer.domElement);

            // Add lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(1, 1, 1);
            scene.add(directionalLight);

            const loader = new THREE.PLYLoader();
            loader.load(
                'pointcloud.ply',
                function(geometry) {
                    geometry.center();
                    geometry.normalize();
                    
                    const material = new THREE.PointsMaterial({
                        size: 0.01,
                        vertexColors: true,
                        sizeAttenuation: true,
                    });
                    
                    pointCloud = new THREE.Points(geometry, material);
                    scene.add(pointCloud);
                },
                function(xhr) {
                    console.log((xhr.loaded / xhr.total * 100) + '% loaded');
                },
                function(error) {
                    console.error('Error loading PLY file:', error);
                }
            );

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (pointCloud) {
                pointCloud.rotation.y += 0.002;
            }
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / (window.innerHeight * 0.5);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight * 0.5);
        }

        window.addEventListener('resize', onWindowResize);
        window.addEventListener('load', init);
    </script>
</body>
</html>
