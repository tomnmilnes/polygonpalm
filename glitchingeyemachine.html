    <script type="text/javascript">
      const canvas = document.getElementById('particle-text');
      const ctx = canvas.getContext('2d');
      const particles = [];
      
      canvas.width = window.innerWidth;
      canvas.height = 250;

      class Particle {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          this.size = 0.5; // Smaller size for more delicate appearance
          this.baseX = x;
          this.baseY = y;
          this.density = (Math.random() * 30) + 1;
          this.random = Math.random();
          this.vx = Math.random() * 2 - 1;
          this.vy = Math.random() * 2 - 1;
          this.angle = Math.random() * 360;
          this.force = 0;
          this.distance = 0;
        }

        draw() {
          ctx.fillStyle = '#ffffff'; // Changed to white
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.closePath();
          ctx.fill();
        }

        update() {
          // Wind effect
          this.angle += 0.5;
          this.force = Math.sin(this.angle * Math.PI / 180) * 0.5;
          
          // Mouse interaction
          if (mouse.x !== undefined) {
            let dx = mouse.x - this.x;
            let dy = mouse.y - this.y;
            this.distance = Math.sqrt(dx * dx + dy * dy);
            
            if (this.distance < mouse.radius) {
              const force = (mouse.radius - this.distance) / mouse.radius;
              const directionX = dx / this.distance;
              const directionY = dy / this.distance;
              this.x -= directionX * force * this.density;
              this.y -= directionY * force * this.density;
            }
          }

          // Ambient movement
          this.x += this.force + Math.sin(this.angle * 0.01) * 0.2;
          this.y += Math.cos(this.angle * 0.02) * 0.2;

          // Return to base position
          const dx = this.baseX - this.x;
          const dy = this.baseY - this.y;
          this.x += dx * 0.05;
          this.y += dy * 0.05;
        }
      }

      const mouse = {
        x: undefined,
        y: undefined,
        radius: 150 // Increased radius of influence
      };

      function initParticles() {
        particles.length = 0;
        ctx.fillStyle = '#ffffff'; // Changed to white
        ctx.font = '60px "Space Mono"'; // Increased font size
        ctx.textAlign = 'center';
        ctx.fillText('GLITCHING', canvas.width/2, 100);
        ctx.fillText('EYE MACHINE', canvas.width/2, 170);
        
        const textCoordinates = ctx.getImageData(0, 0, canvas.width, canvas.height);
        
        // Increase particle density by reducing step size
        for (let y = 0; y < textCoordinates.height; y += 1) { // Changed from 2 to 1
          for (let x = 0; x < textCoordinates.width; x += 1) { // Changed from 2 to 1
            if (textCoordinates.data[(y * 4 * textCoordinates.width) + (x * 4) + 3] > 128) {
              particles.push(new Particle(x, y));
            }
          }
        }
      }

      function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(particle => {
          particle.draw();
          particle.update();
        });
        requestAnimationFrame(animateParticles);
      }

      canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = e.clientX - rect.left;
        mouse.y = e.clientY - rect.top;
      });

      canvas.addEventListener('mouseleave', () => {
        mouse.x = undefined;
        mouse.y = undefined;
      });

      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = 300;
        initParticles();
      });

      initParticles();
      animateParticles();

      // max-device width in pixels for tablets and mobile phones
      var mobileViewWidth = 768;
      // one Line expression to determine if browser is on a mobile device or not
      var isMobile =
        Math.min(window.screen.width, window.screen.height) < mobileViewWidth ||
        navigator.userAgent.indexOf("Mobi") > -1;

      function openNav() {
        if (isMobile) {
          console.log("mobile just clicked!");
          document.getElementById("myNav").style.height = "50%";
        } else {
          document.getElementById("myNav").style.width = "300px";
        }
      }

      function closeNav() {
        if (isMobile) {
          document.getElementById("myNav").style.height = "0%";
        } else {
          document.getElementById("myNav").style.width = "0%";
        }
      }

      onload = (function () {
        var canvas = document.getElementById("myCanvas"),
          context = canvas.getContext("2d"),
          myCanvasContainer = document.getElementById("myCanvasContainer");
        
        // set canvas dimensions on page load
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        document.getElementById("myNav").style.zIndex = 1000;

        // resize the canvas to fill browser window dynamically
        window.addEventListener(
          "resize",
          () => {
            resizeCanvas();
            window.location.reload();
          },
          false
        );

        function resizeCanvas() {
          /**
           * Your drawings need to be inside this function otherwise they will be reset when
           * you resize the browser window and the canvas goes will be cleared.
           */
          drawStuff();
        }
        resizeCanvas();

        function drawStuff() {
          /*
          Set {centerImage} option for cloud. returns image locations for mobile or desktopView
          */
          function setCenterImgUrl() {
            let mobileUrl = "./img/tendermachines/Tender_traparent1.png",
              desktopUrl = "./img/tendermachines/Tender_traparent1.png";
            const imgUrl = isMobile ? mobileUrl : desktopUrl;
            return imgUrl;
          }

          /* 
            Set {offsetX} option in tagCanvas. 0px for mobile and -100px for desktop
          */
          function setOffsetX() {
            const offsetX = isMobile ? 0 : 0;
            return offsetX;
          }
          function setOffsetY() {
            const offsetX = isMobile ? 100 : 100;
            return offsetX;
          }

          /*
          Set the {depth} of cloud in tagCanvas options. O.3 for mobile and 0.75 for desktop views
          */
          function setDepth() {
            const depth = isMobile ? 0.9 : 0.9;
            return depth;
          }
          // function setShape() {
          //   let mobileShape = "hcylinder",
          //     desktopShape = "vcylinder";
          //   const shape = isMobile ? mobileShape : desktopShape;
          //   return shape;
          // }
          function setZoom() {
            const zoom = isMobile ? 0.9 : 1.0;
            return zoom;
          }
          function setStretchX() {
            const stretch = isMobile ? 1.2 : 1.3;
            return stretch;
          }
          function setStretchY() {
            const stretch = isMobile ? 1.5 : 1.0;
            return stretch;
          }
          function setImageScale() {
            const imageScale = isMobile ? 0.5 : 0.9;
            return imageScale;
          }
          function setmaxSpeed() {
            const maxSpeed = isMobile ? 0.9 : 0.03 ;
            return maxSpeed;
          }

          try {
            $("#myCanvas").tagcanvas({
              /*shape: setShape(),*/
              lock: 'y',
              textColour: "#ffffff",
              outlineMethod: "none",
              maxSpeed: setmaxSpeed(),
              depth: setDepth(),
              zoomStep: 0,
              wheelZoom: true,
              zoom: setZoom(),
              clickToFront: true,
              noSelect: false,
              dragControl: false,
              //activeAudio: "./media/click.ogg", audioVolume: 1, audioIconDark: 0,
              initial: [-0.01, 0.005],
              frontSelect: true,
              centreImage: setCenterImgUrl(),
              offsetX: setOffsetX(),
              offsetY: setOffsetY(),
              shape: "vring(0.2, 1)",
              stretchX: setStretchX(),
              stretchY: setStretchY(),
              minBrightness: 0.3,
              maxBrightness: 1.0,
              shuffleTags: true,
              imageScale: setImageScale(),
              
            },'tags');
          } catch (e) {
            console.log(e);
            // something went wrong, hide the canvas container
            document.getElementById("myCanvasContainer").style.display = "none";
          }

           //Save the state, so we can undo the clipping
           //context.save();

          //Create a shape, of some sort
          //context.beginPath();
          //context.moveTo(10, 10);
          //context.lineTo(100, 30);
          //context.lineTo(180, 10);
          //context.lineTo(200, 60);
          //context.arcTo(180, 70, 120, 0, 10);
          //context.lineTo(200, 180);
          //context.lineTo(100, 150);
          //context.lineTo(70, 180);
          //context.lineTo(20, 130);
          //context.lineTo(50, 70);
          //context.closePath();
          //context.fillStyle = "#a0a0a0";
         // context.fillRect(0, 0, canvas.width, canvas.height);
          // Clip to the current path
          //context.clip();
        }
      })();

      $(document).ready(function () {
        let img = $("img"),
          src = img.attr("src"),
          altSrc = img.attr("data-alt-src");

        img.css({
          /* 
          // we want to retain the width and height properties set on images from img setting dimesions here overrides the contsrained values alredy provided
          */
          //width: img.width(),
          //height: img.height(),
          display: "block",
          background: "url(" + src + ")",
          transition: "all 0.6s ease-in-out",
        });

        img
          .mouseenter(() => {
            img.css({
              background: "url(" + altSrc + ")",
            });
          })
          .mouseleave(() => {
            img.css({
              background: "url(" + src + ")",
            });
          });
      });

      window.ga = function () {
        ga.q.push(arguments);
      };
      ga.q = [];
      ga.l = +new Date();
      ga("create", "UA-XXXXX-Y", "auto");
      ga("send", "pageview");
    </script>
